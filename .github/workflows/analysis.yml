name: analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  duckdb-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Keep committed metrics for comparison
        run: cp analysis/outputs/metrics.json /tmp/committed_metrics.json
      - name: Run DuckDB analytics pipeline
        run: python analysis/run_analytics.py
      - name: Recomputed metrics must match the committed ones
        run: |
          python - <<'PY'
          import json
          a = json.load(open("/tmp/committed_metrics.json"))
          b = json.load(open("analysis/outputs/metrics.json"))
          keys = ["customers", "orders", "order_items", "top10pct_revenue_share_pct",
                  "q4_revenue_share_pct", "aov_median", "customers_with_revenue"]
          bad = [k for k in keys if abs(float(a[k]) - float(b[k])) > 0.11]
          assert a["rfm_segment_counts"] == b["rfm_segment_counts"], "RFM counts changed"
          assert not bad, f"metrics drifted: {bad}"
          print("metrics reproduce")
          PY
      - name: README / findings consistency tests
        run: python -m pytest tests -v

  postgres-queries:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: retailpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: retailpulse
    steps:
      - uses: actions/checkout@v4
      - name: Load schema, indexes, views and seed data
        run: for f in schema/0*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null; done
      - name: Data-integrity SQL tests (all must PASS)
        run: |
          psql -At -f tests/test_queries.sql > results.txt
          cat results.txt
          test "$(grep -c '^PASS$' results.txt)" -eq 16
          ! grep -q '^FAIL' results.txt
      - name: All 15 analytical queries execute
        run: for f in queries/basic/*.sql queries/advanced/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -At -f "$f" > /dev/null; done
